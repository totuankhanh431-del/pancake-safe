<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pancake Safe - Backup</title><style>body{font-family:system-ui;background:#fff;color:#111;margin:0}header{padding:12px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center} .badge{background:#22c55e;color:#fff;padding:4px 8px;border-radius:999px;font-size:12px} #list{padding:12px} .item{border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between} input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px}</style></head><body><header><b>Pancake Safe</b><span id="status" class="badge">Đang tải...</span></header><div style="padding:12px"><input id="q" placeholder="Tìm kiếm khách..."></div><div id="list"></div><script>async function load(){let s=await fetch('/api/status').then(r=>r.json());document.getElementById('status').textContent=`Tự động ${s.interval_minutes} phút - ${s.total_customers} khách`;let data=await fetch('/api/customers').then(r=>r.json());let q=document.getElementById('q').value.toLowerCase();let f=data.filter(x=>(x.ten_hien_thi_y_het_pancake||'').toLowerCase().includes(q));document.getElementById('list').innerHTML=f.map(x=>`<div class=item><div><b>${x.ten_hien_thi_y_het_pancake||''}</b><br><small>${x.tin_nhan_cuoi||''}</small></div><div>${x.sdt_trong_tin_nhan||x.sdt_khach||''}</div></div>`).join('')||'<p style=padding:12px>Chưa có dữ liệu backup</p>'}document.getElementById('q').addEventListener('input',load);load();setInterval(load,60000);</script></body></html>
